# Generous network timeouts for slow/restricted connections. These cover
# dependency downloads (JavaFX jars from Maven Central, the javafx Gradle
# plugin from the Plugin Portal) and JDK toolchain provisioning — separate
# from the wrapper's own bootstrap download, which is tuned in
# gradle/wrapper/gradle-wrapper.properties.
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=60000
systemProp.org.gradle.internal.repository.max.retries=5
systemProp.org.gradle.internal.repository.initial.backoff=1000
